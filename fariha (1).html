<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
  <title>Fariha র জন্য 💌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@600;700&family=Hind+Siliguri:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --rose: #e8465a;
      --blush: #f7a8b5;
      --deep: #1a0510;
      --wine: #7b1535;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; }
    body { font-family: 'Hind Siliguri', sans-serif; background: var(--deep); color:#fff; }

    /* CANVAS */
    #petal-canvas { position:fixed; inset:0; z-index:0; pointer-events:none; }

    /* OVERLAY */
    .overlay {
      position:fixed; inset:0; z-index:200;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background: radial-gradient(ellipse at center, #2d0820 0%, #0d0208 100%);
      transition: opacity 1.2s ease, visibility 1.2s ease;
    }
    .overlay.hidden { opacity:0; visibility:hidden; }

    .overlay-photo {
      width: 100px; height: 100px; border-radius:50%; overflow:hidden;
      border: 3px solid rgba(232,70,90,0.6);
      box-shadow: 0 0 40px rgba(232,70,90,0.4);
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }
    .overlay-photo img { width:100%; height:100%; object-fit:cover; }

    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

    .overlay-name {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2rem, 6vw, 3.5rem);
      color: var(--blush);
      margin-bottom: 6px;
      animation: breathe 3s ease-in-out infinite;
    }
    @keyframes breathe { 0%,100%{opacity:0.9;transform:scale(1)} 50%{opacity:1;transform:scale(1.02)} }

    .overlay-sub {
      font-size: 0.85rem; color: rgba(255,255,255,0.4);
      letter-spacing: 3px; text-transform: uppercase; margin-bottom: 40px;
    }

    .heart-btn {
      width:85px; height:85px;
      background: radial-gradient(circle at 35% 35%, #ff6b8a, var(--wine));
      border-radius:50%; display:flex; align-items:center; justify-content:center;
      font-size:36px; cursor:pointer; border:none;
      box-shadow: 0 0 30px rgba(232,70,90,0.4);
      animation: heartbeat 1.5s ease-in-out infinite;
      transition: transform 0.2s;
      position: relative;
    }
    .heart-btn::after {
      content:''; position:absolute; inset:-4px; border-radius:50%;
      border: 2px solid rgba(255,107,138,0.3);
      animation: ripple 1.5s ease-in-out infinite;
    }
    .heart-btn:hover { transform:scale(1.08); }
    @keyframes heartbeat {
      0%,100%{ box-shadow:0 0 0 0 rgba(232,70,90,0.5),0 0 30px rgba(232,70,90,0.3); }
      50%{ box-shadow:0 0 0 18px rgba(232,70,90,0),0 0 50px rgba(232,70,90,0.4); }
    }
    @keyframes ripple { 0%{transform:scale(1);opacity:0.8} 100%{transform:scale(1.5);opacity:0} }

    .btn-label { margin-top:14px; font-size:0.8rem; color:rgba(255,255,255,0.3); letter-spacing:2px; text-transform:uppercase; }

    /* SLIDES */
    .slides-wrap { position:relative; width:100%; height:100%; z-index:1; }
    .slide {
      position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; padding:30px 20px;
      opacity:0; transform:scale(0.95);
      transition: opacity 0.8s ease, transform 0.8s ease;
      pointer-events:none;
    }
    .slide.active { opacity:1; transform:scale(1); pointer-events:all; }

    /* SLIDE 1 */
    .slide-1-bg { background: radial-gradient(ellipse at 40% 60%, #3d0d24 0%, #150309 100%); }

    .s1-photos {
      display:flex; gap:16px; margin-bottom:28px;
      opacity:0; transform:translateY(-15px);
      transition: opacity 0.7s ease 0.3s, transform 0.7s ease 0.3s;
    }
    .slide.active .s1-photos { opacity:1; transform:translateY(0); }

    .s1-photo {
      width:80px; height:80px; border-radius:50%; overflow:hidden;
      border:2px solid rgba(232,70,90,0.5);
      box-shadow: 0 0 20px rgba(232,70,90,0.3);
    }
    .s1-photo img { width:100%; height:100%; object-fit:cover; }

    .slide-1 h1 {
      font-family: 'Hind Siliguri', sans-serif;
      font-size: clamp(1.2rem, 3.5vw, 2rem);
      font-weight: 500; text-align:center; max-width:560px; line-height:1.6;
      color:#fff; opacity:0; transform:translateY(20px);
      transition: opacity 0.8s ease 0.7s, transform 0.8s ease 0.7s;
    }
    .slide.active .slide-1 h1 { opacity:1; transform:translateY(0); }
    .slide-1 h1 span { color: var(--blush); font-weight:500; }

    .slide-1 p.tagline {
      margin-top:12px; font-size:0.9rem; color:rgba(255,255,255,0.4);
      letter-spacing:1px; opacity:0; transition: opacity 0.8s ease 1.1s;
    }
    .slide.active .slide-1 p.tagline { opacity:1; }

    .next-btn {
      margin-top:30px; padding:12px 34px;
      background: linear-gradient(135deg, var(--rose), var(--wine));
      border:none; border-radius:100px; color:#fff;
      font-family:'Hind Siliguri',sans-serif; font-size:0.95rem;
      cursor:pointer; box-shadow:0 10px 30px rgba(232,70,90,0.3);
      opacity:0; transition: opacity 0.8s ease 1.4s, transform 0.2s ease;
    }
    .next-btn:hover { transform:translateY(-2px); }
    .slide.active .next-btn { opacity:1; }

    /* SLIDE 2 — LETTER */
    .slide-2-bg { background: radial-gradient(ellipse at 60% 40%, #2a0818 0%, #0d0208 100%); }

    .letter-card {
      width: min(92vw, 560px); max-height:78vh;
      background: linear-gradient(160deg, rgba(255,245,247,0.07) 0%, rgba(123,21,53,0.07) 100%);
      backdrop-filter:blur(20px);
      border:1px solid rgba(232,70,90,0.2);
      border-radius:24px; padding:28px 28px 20px;
      box-shadow:0 30px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
      overflow:hidden; display:flex; flex-direction:column;
      opacity:0; transform:translateY(30px);
      transition: opacity 0.8s ease 0.2s, transform 0.8s ease 0.2s;
    }
    .slide.active .letter-card { opacity:1; transform:translateY(0); }

    .letter-header {
      display:flex; align-items:center; gap:12px;
      margin-bottom:18px; padding-bottom:16px;
      border-bottom:1px solid rgba(232,70,90,0.15); flex-shrink:0;
    }
    .letter-avatar {
      width:48px; height:48px; border-radius:50%; overflow:hidden;
      border:2px solid rgba(232,70,90,0.5); flex-shrink:0;
    }
    .letter-avatar img { width:100%; height:100%; object-fit:cover; }
    .letter-from { font-family:'Dancing Script',cursive; font-size:1.3rem; color:var(--blush); }
    .letter-date { font-size:0.72rem; color:rgba(255,255,255,0.3); letter-spacing:1px; }

    .letter-scroll { overflow-y:auto; flex:1; padding-right:6px; }
    .letter-scroll::-webkit-scrollbar { width:3px; }
    .letter-scroll::-webkit-scrollbar-thumb { background:rgba(232,70,90,0.4); border-radius:10px; }

    #letter-body {
      font-family:'Hind Siliguri',sans-serif;
      font-size:clamp(0.95rem, 2.5vw, 1.05rem);
      line-height:1.95; color:rgba(255,255,255,0.88);
      white-space:pre-wrap; font-weight:400;
    }

    .cursor-blink {
      display:inline-block; width:2px; height:1em;
      background:var(--rose); margin-left:2px;
      vertical-align:middle; animation:blink 1s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .letter-footer {
      margin-top:16px; padding-top:14px;
      border-top:1px solid rgba(232,70,90,0.12);
      display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
    }
    .footer-photos { display:flex; gap:8px; }
    .footer-photo {
      width:36px; height:36px; border-radius:50%; overflow:hidden;
      border:1px solid rgba(232,70,90,0.4);
    }
    .footer-photo img { width:100%; height:100%; object-fit:cover; }
    .letter-sign { font-family:'Dancing Script',cursive; font-size:1.4rem; color:var(--blush); text-align:right; }
    .letter-sign-sub { font-size:0.7rem; color:rgba(255,255,255,0.25); letter-spacing:1px; }

    /* DOTS */
    .dots { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:100; }
    .dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.2); transition:background 0.3s,transform 0.3s; }
    .dot.on { background:var(--rose); transform:scale(1.3); box-shadow:0 0 8px rgba(232,70,90,0.7); }

    @media(max-width:480px){
      .letter-card{ padding:20px 16px 16px; }
      .s1-photo{ width:65px; height:65px; }
    }
  </style>
</head>

<script>
// PETALS
const canvas = document.getElementById('petal-canvas');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
resize(); window.addEventListener('resize', resize);
const petals=[];
class Petal{
  constructor(){ this.reset(); this.y=Math.random()*canvas.height; }
  reset(){
    this.x=Math.random()*canvas.width; this.y=canvas.height+20;
    this.size=Math.random()*7+3; this.speed=Math.random()*1.2+0.4;
    this.drift=(Math.random()-0.5)*0.7; this.rot=Math.random()*Math.PI*2;
    this.rotSpeed=(Math.random()-0.5)*0.03;
    this.alpha=Math.random()*0.45+0.2;
    this.hue=Math.random()>0.5?'#e8465a':'#f7a8b5';
  }
  update(){ this.y-=this.speed; this.x+=this.drift; this.rot+=this.rotSpeed; if(this.y<-20)this.reset(); }
  draw(){
    ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.rot);
    ctx.globalAlpha=this.alpha; ctx.fillStyle=this.hue;
    ctx.beginPath(); ctx.ellipse(0,0,this.size,this.size*0.55,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
}
for(let i=0;i<50;i++) petals.push(new Petal());
function animPetals(){ ctx.clearRect(0,0,canvas.width,canvas.height); petals.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(animPetals); }
animPetals();

// LETTER TEXT
const letterText = `Fariha,

আমি জানি তুমি এখন আমার উপর অনেক রাগে আছ... আর তোমার রাগ করার পুরো অধিকার আছে। আমি ভুল করেছি, সেটা মানছি। মন থেকে, সত্যিকার অর্থেই — অনেক অনেক sorry। 😔

আমি তোমাকে কষ্ট দিতে চাইনি — এভাবে না, কখনোই না। তুমি আমার কাছে অনেক বেশি গুরুত্বপূর্ণ, শুধু একটা ভুলের চেয়ে অনেক অনেক বেশি। এটা please বিশ্বাস করো।

তুমি শুধু কথা বলার মানুষ না আমার কাছে... তুমি এমন কেউ যাকে আমি সত্যিই care করি। তোমাকে কষ্টে দেখতে — আর জানতে যে সেই কষ্টটা আমি দিয়েছি — এটা আমার জন্য সবচেয়ে কঠিন অনুভূতি। 💔

তোমাকে miss করছি। তোমার reply miss করছি, তোমার কথা miss করছি, সবকিছু। এই চুপ থাকাটা ভেতরে ভেতরে অনেক কষ্ট দিচ্ছে।

একটা ভুলের জন্য please আমাদের সব শেষ করে দিও না। আমি perfect না — কখনো বলিওনি। কিন্তু promise করছি, আরো ভালো হওয়ার চেষ্টা করব। তুমি যেন গর্বিত হতে পারো আমাকে নিয়ে — এটাই চাই।

তোমার জন্য সবসময় দুয়া করি। তুমি যে স্বপ্নগুলোর কথা বলো — সেগুলো পূরণ হোক। তুমি অনেক বড় হও, তোমার নাম ছড়িয়ে পড়ুক — আমি সবসময় তোমার সবচেয়ে বড় supporter। ✨

আর সত্যি বলতে... তোমার সাথে এই সম্পর্ক কখনো শেষ হোক, এটা আমি চাই না। কখনোই না।

একটাই অনুরোধ — আমার কথাটাও একটু বোঝার চেষ্টা করো। আমি ইচ্ছে করে কিছু করিনি। Sorry বলতে বলতে ক্লান্ত হয়ে গেছি, কিন্তু বলতেই থাকব — কারণ তুমি সেই মানুষ যার কাছে আমি সত্যিই sorry।

Please মাফ করে দাও... 🌸💗`;

// TYPING
function typeText(el, text, speed, done){
  let i=0; el.innerHTML='';
  const cursor=document.createElement('span'); cursor.className='cursor-blink'; el.appendChild(cursor);
  function tick(){
    if(i<text.length){
      el.insertBefore(document.createTextNode(text[i]),cursor); i++;
      const scroll=el.closest('.letter-scroll'); if(scroll) scroll.scrollTop=scroll.scrollHeight;
      setTimeout(tick,speed);
    } else { if(done) done(); }
  }
  tick();
}

// OVERLAY
document.getElementById('startBtn').onclick=()=>{
  document.getElementById('overlay').classList.add('hidden');
  setTimeout(()=>{ document.getElementById('slide1').classList.add('active'); },400);
};

// NEXT BTN
document.getElementById('toLetterBtn').onclick=()=>{
  document.getElementById('slide1').classList.remove('active');
  document.getElementById('dot1').classList.remove('on');
  document.getElementById('dot2').classList.add('on');
  setTimeout(()=>{
    document.getElementById('slide2').classList.add('active');
    setTimeout(()=>{ typeText(document.getElementById('letter-body'), letterText, 25); },600);
  },300);
};
